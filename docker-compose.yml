version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: inceptrac_recruitment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_db

  celery_worker:
    build: ./backend
    command: celery -A celery_app.tasks worker --loglevel=info -P solo
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_db

  celery_beat:
    build: ./backend
    command: celery -A celery_app.tasks beat --loglevel=info
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:
